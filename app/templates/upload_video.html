<!DOCTYPE html>
<html>
<head>
    <title>Upload Video</title>
    <style>body { text-align: center; font-family: Arial; }</style>
</head>
<body>
    <h1>Upload Video for Detection</h1>
    <form method="post" enctype="multipart/form-data" style="margin-bottom: 20px;">
        <input type="file" name="file" accept="video/*" required>
        <button type="submit" style="padding: 5px 15px;">Detect</button>
    </form>
    
    {% if video_path %}
    <div style="margin: 20px;">
        <h2>Processing Video...</h2>
        <!-- Video playback not easily supported for streaming processed output directly in this simple setup without more complex backend logic. 
             We will stream the response. -->
        <p>Video is being processed. If you see this, check the stream URL.</p>
    </div>
    {% endif %}
    
    <br>
    <a href="/" style="padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 5px;">Back to Home</a>
</body>
</html>
