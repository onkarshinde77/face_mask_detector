<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Photo - Face Mask Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="navbar-brand">🎭 Face Mask Detector</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/upload_video">Upload Video</a>
        <a href="/live">Live Camera</a>
      </div>
    </div>

    <div class="container">
      <div class="upload-section">
        <h1>📷 Upload Photo</h1>
        <p style="color: #666; margin-bottom: 30px;">Select an image to detect face masks</p>

        <form method="post" enctype="multipart/form-data">
          <label for="file-input" class="file-input-label">
            <div>📁 Click to choose a photo or drag and drop</div>
            <div class="file-name" id="file-name">No file chosen</div>
            <input type="file" id="file-input" name="file" accept="image/*" required />
          </label>
          <button type="submit" class="btn">🔍 Detect Masks</button>
        </form>

        {% if image_path %}
          <div class="result-section">
            <h2>✅ Detection Results</h2>
            <div style="color: #555; margin-bottom: 20px; font-size: 16px;">
              <strong>Status: {{ detection }}</strong>
            </div>
            <img src="{{ image_path }}" alt="Detection result" class="result-image" />
          </div>
        {% endif %}

        <a href="/" class="back-link">← Back to Home</a>
      </div>
    </div>

    <script>
      document.getElementById('file-input').addEventListener('change', function (e) {
        const fileName = e.target.files[0]?.name || 'No file chosen'
        document.getElementById('file-name').textContent = fileName
      })
    </script>
  </body>
</html>
