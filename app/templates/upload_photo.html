<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Mask Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload_photo.css') }}">
</head>
<body>

<div class="container">
    <h1>📸 Mask Detection</h1>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="upload">📤 Upload Photo</button>
        <button class="tab-btn" data-tab="capture">📷 Capture Photo</button>
    </div>

    <!-- Upload Tab -->
    <div id="upload-tab" class="tab-content active">
        <div class="upload-section">
            <form method="post" enctype="multipart/form-data" id="uploadForm">
                <input type="file" name="file" accept="image/*" required id="fileInput" hidden>

                <button type="button" class="btn btn-secondary" id="selectBtn">
                    📁 Select Image
                </button>

                <p id="fileLabel">No file chosen</p>

                <button type="submit" class="btn btn-success" id="uploadSubmit">
                    🚀 Start Detection
                </button>
            </form>
        </div>
    </div>

    <!-- Capture Tab -->
    <div id="capture-tab" class="tab-content">
        <div class="upload-section">
            <video id="cameraVideo" autoplay playsinline muted class="camera-video"></video>
            <div id="previewContainer"></div>
            <canvas id="canvas" hidden></canvas>

            <div class="camera-buttons">
                <button id="startCameraBtn" class="btn">▶️ Start Camera</button>
                <button id="captureBtn" class="btn btn-success" disabled>📸 Capture</button>
                <button id="retakeBtn" class="btn btn-secondary hidden">🔄 Retake</button>
                <button id="analyzeBtn" class="btn btn-success hidden">✅ Analyze Mask</button>
            </div>
        </div>
    </div>

    {% if image_path %}
    <div class="result-section">
        <div class="summary">{{ detection }}</div>

        <img src="{{ image_path }}" class="result-image">

        <div class="detection-list">
            {% for d in detections %}
            <div class="detection-item {{ 'mask' if d.label == 'Mask' else 'no-mask' }}">
                <strong>{{ d.label }}</strong><br>
                Face : {{ d.face_num }}<br>
                Confidence: {{ d.confidence }}
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>

<!-- External JS -->
<script src="{{ url_for('static', filename='js/upload_photo.js') }}"></script>

</body>
</html>
