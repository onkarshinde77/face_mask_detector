<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Face Mask Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload_photo.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1>📸 Mask Detection</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="upload">📤 Upload Photo</button>
        <button class="tab-btn" data-tab="capture">📷 Capture Photo</button>
      </div>

      <!-- ── Upload Tab ── -->
      <div id="upload-tab" class="tab-content active">
        <div class="upload-section">
          <input type="file" name="file" accept="image/*" id="fileInput" hidden />
          <button type="button" class="btn btn-secondary" id="selectBtn">📁 Select Image</button>
          <p id="fileLabel">No file chosen</p>
          <button type="button" class="btn btn-success" id="uploadSubmit">🚀 Start Detection</button>
        </div>
      </div>

      <!-- ── Capture Tab ── -->
      <div id="capture-tab" class="tab-content">
        <div class="upload-section">
          <div id="cameraPlaceholder" class="camera-placeholder">
            <div class="camera-placeholder-icon">📷</div>
            <p>Click <strong>Start Camera</strong> to enable your webcam</p>
          </div>
          <video id="cameraVideo" autoplay playsinline muted class="camera-video"></video>
          <div id="previewContainer"></div>
          <canvas id="canvas" hidden></canvas>
          <div class="camera-buttons">
            <button id="startCameraBtn"  class="btn btn-secondary">▶️ Start Camera</button>
            <button id="captureBtn"      class="btn btn-success hidden">📸 Capture</button>
            <button id="stopCameraBtn"   class="btn hidden">⏹ Stop</button>
            <button id="retakeBtn"       class="btn btn-secondary hidden">🔄 Retake</button>
            <button id="analyzeBtn"      class="btn btn-success hidden">✅ Analyze Mask</button>
          </div>
        </div>
      </div>

      <!-- ── Result Section (rendered by JS) ── -->
      <div id="resultSection" class="result-section" style="display:none;"></div>
    </div>

    <script src="{{ url_for('static', filename='js/upload_photo.js') }}"></script>
  </body>
</html>
